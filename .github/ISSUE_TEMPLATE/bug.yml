name: Bug report
description: Something in FrostRig doesn't work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: System report
      description: Settings → "Copy system report", then paste it here.
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Service log (optional)
      description: "Output of: journalctl -u frostrigd -b --no-pager | tail -n 50"
      render: text
