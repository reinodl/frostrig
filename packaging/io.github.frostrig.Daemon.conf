<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only the service (root) may own the name. -->
  <policy user="root">
    <allow own="io.github.frostrig.Daemon"/>
  </policy>
  <!-- Anyone may talk to it; every change is checked with polkit inside the service. -->
  <policy context="default">
    <allow send_destination="io.github.frostrig.Daemon"/>
  </policy>
</busconfig>
